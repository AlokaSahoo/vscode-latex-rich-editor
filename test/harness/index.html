window.__init = () => ({ type: "init", text: window.__text, customCommands: {}, pageWidth: 880, pageAlign: "center", showToolbar: true, pdfWorkerUrl: "../../dist/pdf.worker.min.mjs", references: { labels: {}, citations: {} }, project: { externalLabels: [], bibliography: [] } });
