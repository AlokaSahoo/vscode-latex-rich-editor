name: Release

# Pushing a tag like v0.1.0 builds the .vsix and attaches it to a GitHub
# Release. The same file installs on macOS, Windows and Linux.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vsce package --out latex-rich-editor-${{ github.ref_name }}.vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: latex-rich-editor-${{ github.ref_name }}.vsix
          generate_release_notes: true
